name: Nestor HA Addon
version: 0.12.3
slug: nestor_ha_addon
description: >-
  Addon Nestor — connecte Home Assistant (WebSocket) à Azure SignalR Serverless
  (commandes et inventaire Digital Twin) et publie la télémétrie vers Azure
  Event Grid MQTT.
image: registry.dev.nestor-smarthome.com/nestor-ha-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
devices:
  - /dev/tpmrm0
map:
  - ssl:ro
  - config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:swap-horizontal-bold
panel_title: Nestor HA Addon

options:
  signalr:
    negotiate_url: "https://<functions>.azurewebsites.net/api/negotiate"
  ha:
    entity_filter:
      - "light."
      - "switch."
      - "sensor."
      - "binary_sensor."
  event_grid_mqtt:
    enabled: false
    hostname: ""
  registry:
    credential_url: "https://registry-auth.dev.nestor-smarthome.com/credential"
  registry_server: "registry.dev.nestor-smarthome.com"

schema:
  tpm_tcti: str?
  signalr:
    negotiate_url: str
  ha:
    entity_filter:
      - str
    temperature_history_hours: int(1,48)?
  registry:
    credential_url: str?
  registry_server: str?
  event_grid_mqtt:
    enabled: bool
    hostname: str
    port: int(1,65535)?
    client_id: str?
    cert_path: str?
    key_path: str?
    use_tls: bool?
    temperature_report_interval_minutes: int(1,1440)?
