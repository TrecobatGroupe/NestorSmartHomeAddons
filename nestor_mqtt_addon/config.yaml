name: Nestor MQTT
version: 1.0.3
slug: nestor_mqtt_addon
description: >-
  Addon Nestor — publie la télémétrie de Home Assistant (températures) vers Azure Event Grid MQTT.
image: registry.dev.nestor-smarthome.com/nestor-mqtt-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
devices:
  - /dev/tpmrm0
map:
  - ssl:ro

options:
  event_grid_mqtt:
    hostname: ""
    use_tls: true

schema:
  tpm_tcti: str?
  event_grid_mqtt:
    hostname: str
    port: int(1,65535)?
    client_id: str?
    use_tls: bool?
    temperature_report_interval_minutes: int(1,1440)?
