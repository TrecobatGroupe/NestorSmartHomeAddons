name: NESTOR Bootstrap
version: "0.4.0"
slug: nestor_bootstrap
description: Provisioning initial et renouvellement du certificat mTLS de la Box
arch:
  - amd64
  - aarch64
startup: system
boot: auto
init: false
image: registry.dev.nestor-smarthome.com/nestor-bootstrap
map:
  - ssl:rw
devices:
  - /dev/tpmrm0
options:
  est_base_url: "https://est.nestor.trecobat.fr"
  identity_provider: "tpm2"
  identity_key_uri: "handle:0x81000001"
  mtls_key_parent: "0x81000002"
  tpm_tcti: ""
  renewal_threshold_days: 30
  check_interval_hours: 12
schema:
  est_base_url: url
  identity_provider: str
  identity_key_uri: str
  mtls_key_parent: str?
  tpm_tcti: str?
  renewal_threshold_days: int(1,89)
  check_interval_hours: int(1,24)
